# claude-dev 라벨이 붙은 이슈를 Claude가 구현하고, 이슈에 [Create PR] 링크를 댓글로 남긴다.
# 필요한 설정: Claude GitHub App 설치 + Secret CLAUDE_CODE_OAUTH_TOKEN (`/install-github-app` 이 둘 다 해 줌)
name: Claude Dev

on:
  issues:
    types: [labeled]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude-dev"
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(pip install:*),Bash(pytest:*),Bash(ruff:*)"
